summary: "Candidate-convention and sampling-support census over 27 NASA fixtures at both query polarities, superseding an earlier defective run. Corrected, ladder rung (i) reproduces production exactly (MAE 0.66651 vs 0.66651, 100.0 percent agreement), so the earlier claim that the query support carried the production gap is retracted - there is no gap. On the tasks themselves the answer is unfavourable: held at production own polarity the position-faithful vocabulary is inert to harmful (+0.04 percent blocks steerable, -1.26 percent occupancy, negative on standard everywhere), and the paper tiled construction is a small consistent win on text only (+1.93 / +0.68 percent), under the 3.0 percent bar in every cell. The largest effect belongs to neither task: production shape term inverts the query while its tone pre-filter, renderer and ink-high candidates all treat ink as bright, and flipping only that recovers 0.306 / 0.247 MAE on blocks and lifts SSIM from ~0.004 to 0.307 / 0.105. Second unexplained result: bounds-centring at true cell aspect beats position-faithful on blocks in all four cells. Tiled arms did not go degenerate (72 windows, 4320-D); the shipping 2x4 thumbnail cell carries ~3 of 60 live bins and diagram fixtures 0.33-0.69. Native block sizes are reported as min-max ranges (nasa-steerable-v1 is 38-39 x 76-77) because fractional scaling varies them cell to cell."
