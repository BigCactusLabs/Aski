  - "Run in RELEASE configuration at the shipping regime: columns 80, oversample 2, converter defaults, exhaustive census over every cell of all 27 fixtures in the two photographic corpora"
  - "Both arms are driven through the REAL ASCIIConverter.convert via the RenderingOptions.shapeQueryPolarity SPI knob added in this unit. No lab sampler stands in for the matcher on either side: the picks scored are the picks the shipped matcher makes"
  - "The decision rule was pre-registered in the ASKI-60 design addendum BEFORE this run, including the four-way CANDIDATE/INCONCLUSIVE/KILL/INVALID split, and is encoded in PolarityGate.verdict with one unit test per branch. It fired KILL on a clause the blocks numbers alone would not have reached"
  - "Negative control ran on every scored pair, not a sample: both planes negated and re-scored. Max absolute GMSD delta 2.9e-07 and max absolute MAE delta 1.6e-08 over 453120 pairs, against a 1e-06 tolerance. GMSD is negation-invariant by construction (Prewitt kernels are zero-mean), so it cannot be flattered by the ink convention under test; the residual is float rounding in 1 minus x"
  - "MAE is the verdict oracle (ASKI-27 house oracle). GMSD is the convention-independent guard. SSIM and HaarPSI are reported and never decide: SSIM keeps a luminance term and is polarity-coupled by construction"
  - "Mechanism measured rather than assumed: the tone pre-filter prunes to topK = 12 + round(density*24) = 12 at default density, and ShapeMatching takes prefix(min(topK, count)). blocks carries 8 glyphs, so its pool admits every glyph and the shape distance ranks the whole set (brightness and index tie-breaks still apply on equal distances); standard (95) and braille (256) both bind at 12. The differing-pick shares track that exactly on standard (0.1 and 0.3 percent) but not on braille (4.1 and 19.5 percent), so the pre-filter explains standard's inertness and only part of braille's behavior"
  - "The scoring path is the ink-high glyph raster against raw source luma, shared byte-for-byte with convention-ablation through the extracted ConventionAblation.scoringRasters. That convention is the same one the direct arm uses, so direct is partly flattered by its own oracle. This is the reason GMSD is carried as a guard and the reason the negative control is mandatory, but it is a caveat the run does not dissolve"
  - "Instrument cross-check: on earth-limb-sunrise at this regime the inverted arm reproduces convention-ablation's production arm at MAE 0.83833 over the same 2880 cells"
