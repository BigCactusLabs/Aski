summary: "Exhaustive polarity census over 27 NASA fixtures at the shipping regime, driving the real converter through the new shapeQueryPolarity knob. Verdict KILL, on the pre-registered collateral clause and not on the deciding charset. On blocks the direct query is a very large win - MAE 0.66651 to 0.35330 on steerable (+46.99 percent) and 0.65714 to 0.39564 on occupancy (+39.79 percent), with GMSD agreeing in sign in both cells (+36.38 and +1.42 percent) and 38.6 / 35.5 percent of picks moving. standard is inert to four decimal places in both corpora (-0.01 and -0.00 percent MAE, 0.1 and 0.3 percent of picks moving), which the pool measurement explains: blocks is the only charset whose glyph count sits under the pre-filter's topK of 12, so it is the only charset where the tone pre-filter excludes nothing and the shape distance ranks the whole set. braille is where the treatment fails - occupancy braille regresses -3.26 percent MAE and -17.50 percent GMSD, both oracles agreeing that braille gets worse, past the pre-registered 3.0 percent veto. The veto is cleared by 0.26 points, so the KILL is close, but the rule was frozen before the run and both oracles agree on the direction. Negative control holds at 2.9e-07 max absolute GMSD delta over 453120 pairs. No default changed."
